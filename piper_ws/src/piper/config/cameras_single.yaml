# Cameras for the single-arm robot (`--robot single`), started by cameras.launch.py.
# Each camera publishes /<name>/color/image_raw; the names must match the color_topic entries
# of the `single` robot in robot_configs.yaml (camera_side -> cam_side, camera_wrist -> cam_wrist).
#
# type: realsense
#   serial_no:    RealSense serial number (piper_ws/scripts/list_cameras.sh). Empty = first device found.
#   width/height/fps: color (and depth) stream profile
#   enable_depth: also publish /<name>/depth/image_rect_raw (default false)
# type: usb (any UVC/V4L2 camera, driven by v4l2_camera)
#   video_device: prefer the stable /dev/v4l/by-id/...-video-index0 path over /dev/videoN
#   width/height: must be a size supported by the camera (v4l2-ctl -d <device> --list-formats-ext);
#                 the frame rate is the camera default for that size
#   pixel_format: YUYV (default) or another raw format the camera supports
cameras:
  - name: camera_side
    type: usb
    video_device: /dev/video0
    width: 640
    height: 480

  - name: camera_wrist
    type: realsense
    serial_no: ""
    width: 640
    height: 480
    fps: 30
    enable_depth: false
